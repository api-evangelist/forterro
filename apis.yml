aid: forterro
name: Forterro
description: >-
  Forterro is a pan-European industrial software company, founded in 2012 and
  headquartered in London, that provides enterprise resource planning (ERP) and
  specialised business software to the industrial mid-market. Built through a
  series of acquisitions, Forterro operates a portfolio of regional and vertical
  ERP brands - including Abas, Jeeves, Garp, Proconcept, Sylob, Silog, Myfactory,
  Orderwise, Clipper, 123Insight, BPSC, Helios, Proffix, Prodaso and its
  cloud-native Fortee product - alongside best-in-class point solutions such as
  warehouse management (WMS), point of sale (POS), material requirements planning
  (MRP) and business intelligence. The company serves more than 13,000 industrial
  businesses across manufacturing, warehousing, wholesale and retail from 40+
  offices worldwide.
